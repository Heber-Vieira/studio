
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FF69B4">
    <meta name="format-detection" content="telephone=no">
    <title>BellaAI | Gestão Vibrante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Ocultar barra de rolagem globalmente */
        html, body {
            -ms-overflow-style: none;  /* IE e Edge */
            scrollbar-width: none;     /* Firefox */
            overscroll-behavior-y: none; /* Previne o efeito elástico de pull-to-refresh em PWAs */
            -webkit-tap-highlight-color: transparent; /* Remove highlight cinza ao tocar em botões no mobile */
        }

        html::-webkit-scrollbar, 
        body::-webkit-scrollbar {
            display: none;             /* Chrome, Safari e Opera */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
        }
        .vibrant-glow:hover {
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Utilitário para esconder barra de rolagem em elementos específicos */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Safe Area Utilities for iOS Notch/Home Bar */
        .safe-pt {
            padding-top: env(safe-area-inset-top);
        }
        .safe-pb {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .safe-pl {
            padding-left: env(safe-area-inset-left);
        }
        .safe-pr {
            padding-right: env(safe-area-inset-right);
        }

        /* Otimização para Impressão de Fichas e Comprovantes */
        @media print {
            body * {
                visibility: hidden;
            }
            /* Garante que o container do modal seja visível e posicionado corretamente */
            .fixed.inset-0.z-\[100\], 
            .fixed.inset-0.z-\[110\],
            .fixed.inset-0.z-\[120\] {
                visibility: visible !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                height: 100% !important;
                background: white !important; 
                backdrop-filter: none !important;
                display: block !important;
            }
            
            /* Torna visível o conteúdo dentro do modal */
            .fixed.inset-0.z-\[100\] *, 
            .fixed.inset-0.z-\[110\] *,
            .fixed.inset-0.z-\[120\] * {
                visibility: visible !important;
            }

            /* Ajusta o card branco do modal para ocupar a folha inteira */
            .fixed.inset-0 .bg-white {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                position: static !important;
                overflow: visible !important;
            }

            /* Forçar cores e fundos na impressão */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Esconde botões e elementos indesejados na impressão */
            button, .print\:hidden, .X, .X * {
                display: none !important;
            }

            /* Ajustar containers de scroll */
            .overflow-y-auto {
                overflow: visible !important;
                max-height: none !important;
            }
        }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
